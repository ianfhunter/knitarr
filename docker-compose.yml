networks:
  splash_default:
    external: true

volumes:
  # Pin absolute name so rebuilds from this directory still reuse splash_knitarr_data.
  knitarr_data:
    name: splash_knitarr_data

services:
  knitarr:
    build: .
    container_name: knitarr
    restart: unless-stopped
    networks:
      - splash_default
    environment:
      KNITARR_DATA_DIR: /data
      KNITARR_DB_PATH: /data/knitarr.db
      KNITARR_LIBRARY_DIR: /data/library
      KNITARR_IA_USER_AGENT: ${KNITARR_IA_USER_AGENT:-Knitarr/0.1 (self-hosted; contact via local admin)}
      KNITARR_EUROPEANA_API_KEY: ${KNITARR_EUROPEANA_API_KEY:-apidemo}
      KNITARR_SI_API_KEY: ${KNITARR_SI_API_KEY:-}
      KNITARR_PIXABAY_API_KEY: ${KNITARR_PIXABAY_API_KEY:-}
      KNITARR_DMC_ALGOLIA_APP_ID: ${KNITARR_DMC_ALGOLIA_APP_ID:-}
      KNITARR_DMC_ALGOLIA_SEARCH_KEY: ${KNITARR_DMC_ALGOLIA_SEARCH_KEY:-}
      KNITARR_DMC_ALGOLIA_INDEX: ${KNITARR_DMC_ALGOLIA_INDEX:-}
      KNITARR_GITHUB_REPO: ${KNITARR_GITHUB_REPO:-}
      KNITARR_GITHUB_RELEASE_PREFIX: ${KNITARR_GITHUB_RELEASE_PREFIX:-knitarr-}
    volumes:
      - knitarr_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8765/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
