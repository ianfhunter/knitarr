networks:
  splash_default:
    external: true

volumes:
  knitarr_data:

services:
  knitarr:
    build: .
    container_name: knitarr
    restart: unless-stopped
    networks:
      - splash_default
    ports:
      - "${KNITARR_PORT:-8765}:8765"
    environment:
      KNITARR_DATA_DIR: /data
      KNITARR_DB_PATH: /data/knitarr.db
      KNITARR_LIBRARY_DIR: /data/library
      KNITARR_IA_USER_AGENT: ${KNITARR_IA_USER_AGENT:-Knitarr/0.1 (self-hosted; contact via local admin)}
      KNITARR_WORKER_INTERVAL_SEC: ${KNITARR_WORKER_INTERVAL_SEC:-15}
    volumes:
      - knitarr_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8765/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
