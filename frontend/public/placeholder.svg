<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Knitarr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe8df"/>
      <stop offset="55%" stop-color="#e4d8cb"/>
      <stop offset="100%" stop-color="#d7c7b6"/>
    </linearGradient>
    <radialGradient id="wool" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3c0c7"/>
      <stop offset="50%" stop-color="#d4788a"/>
      <stop offset="100%" stop-color="#9e455b"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5f50"/>
      <stop offset="100%" stop-color="#243c32"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c9b8a4" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="480" height="280" fill="url(#bg)"/>
  <rect width="480" height="280" fill="url(#grid)"/>

  <!-- soft vignette corners -->
  <rect width="480" height="280" fill="none" stroke="#c2b09a" stroke-width="2" opacity="0.55"/>

  <!-- yarn ball -->
  <g transform="translate(168 42)">
    <circle cx="72" cy="78" r="58" fill="url(#wool)"/>
    <g fill="none" stroke="#7f3548" stroke-width="3.2" stroke-linecap="round" opacity="0.88">
      <path d="M24 62c18-16 46-19 68-7"/>
      <path d="M20 82c24-14 54-13 74 2"/>
      <path d="M26 104c22-10 48-8 66 6"/>
      <path d="M40 32c8 20 9 48 0 72"/>
      <path d="M60 24c7 22 6 50-4 74"/>
      <path d="M84 26c5 24 2 52-10 74"/>
      <path d="M106 40c0 22-8 46-24 64"/>
    </g>
    <ellipse cx="52" cy="56" rx="16" ry="11" fill="#fff" opacity="0.28"/>
    <!-- loose yarn -->
    <path d="M120 108c14 10 28 14 40 6" fill="none" stroke="#d4788a" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 114c8-4 14 4 8 10" fill="none" stroke="#9e455b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text
    x="240"
    y="232"
    text-anchor="middle"
    font-family="'Google Sans', 'Segoe UI', system-ui, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#ink)"
  >Knitarr</text>
  <text
    x="240"
    y="256"
    text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="13"
    letter-spacing="2.2"
    fill="#6a5a4a"
    opacity="0.8"
  >PATTERN LIBRARY</text>
</svg>
